<style>
#agilenest-design{--an-bg:light-dark(#f5f7fb,#141a23);--an-panel:light-dark(#ffffff,#1b2330);--an-text:light-dark(#172334,#e7ecf4);--an-muted:light-dark(#586678,#a2afc2);--an-line:light-dark(#e1e6ed,#334054);--an-brand:light-dark(#294a78,#92b6e8);--an-soft:light-dark(#edf2f9,#24364f);--an-active-text:light-dark(#ffffff,#15253c);--an-warn:light-dark(#914b17,#e6a16d);--an-error:light-dark(#b42336,#f47f87);--an-green:light-dark(#16713c,#79d6a0);font:14px/1.55 'Segoe UI','Microsoft YaHei',sans-serif;color:var(--an-text);background:var(--an-bg);border:1px solid var(--an-line);border-radius:12px;overflow:hidden;--an-space:14px}
#agilenest-design *{box-sizing:border-box}
#agilenest-design button,#agilenest-design input,#agilenest-design select{font:inherit;color:inherit}
#agilenest-design button{border:1px solid var(--an-line);background:var(--an-panel);border-radius:7px;padding:6px 11px;text-align:left}
#agilenest-design button:hover{background:var(--an-soft)}
#agilenest-design button[aria-pressed=true]{background:var(--an-brand);color:var(--an-active-text);border-color:var(--an-brand)}
#agilenest-design .an-brand{color:var(--an-brand);font-weight:600;letter-spacing:-.5px;font-size:19px}
#agilenest-design .an-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 110px 16px 20px;border-bottom:1px solid var(--an-line);background:var(--an-panel)}
#agilenest-design .an-small{font-size:12px;color:var(--an-muted)}
#agilenest-design .an-shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:530px}
#agilenest-design .an-nav{padding:20px 12px;background:var(--an-panel);border-right:1px solid var(--an-line)}
#agilenest-design .an-nav button{display:block;width:100%;margin-bottom:6px;border-color:transparent}
#agilenest-design .an-nav .an-section{padding:18px 10px 8px;color:var(--an-muted);font-size:12px}
#agilenest-design .an-static{display:block;padding:8px 11px;color:var(--an-muted)}
#agilenest-design .an-main{padding:22px;min-width:0}
#agilenest-design .an-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
#agilenest-design h2{font-size:23px;line-height:1.4;margin:3px 0 6px;font-weight:600;letter-spacing:-.5px}
#agilenest-design h3{font-size:16px;line-height:1.5;font-weight:600;margin:0 0 12px}
#agilenest-design p{margin:0 0 12px}
#agilenest-design .an-focus{display:flex;gap:6px;flex-wrap:wrap;margin:17px 0}
#agilenest-design .an-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--an-line)}
#agilenest-design input{min-width:0;width:180px;max-width:100%;border:1px solid var(--an-line);border-radius:7px;background:var(--an-panel);padding:7px 10px}
#agilenest-design .an-content{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
#agilenest-design .an-content.an-has-detail{grid-template-columns:minmax(0,1fr) minmax(240px,310px)}
#agilenest-design .an-list{border-top:1px solid var(--an-line)}
#agilenest-design .an-row{display:flex;gap:12px;align-items:flex-start;padding:var(--an-space) 0;border-bottom:1px solid var(--an-line)}
#agilenest-design .an-row .an-task-title{padding:0;border:0;background:transparent;font-weight:500;border-radius:2px;display:block;margin-bottom:5px;overflow-wrap:anywhere}
#agilenest-design .an-row .an-task-title:hover{color:var(--an-brand)}
#agilenest-design .an-task-main{min-width:0;flex:1}
#agilenest-design .an-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--an-muted)}
#agilenest-design .an-pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;color:var(--an-muted)}
#agilenest-design .an-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
#agilenest-design .an-pill[data-status=in_progress]{color:var(--an-brand)}
#agilenest-design .an-pill[data-status=submitted]{color:var(--an-warn)}
#agilenest-design .an-pill[data-status=rejected]{color:var(--an-error)}
#agilenest-design .an-pill[data-status=accepted]{color:var(--an-green)}
#agilenest-design .an-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
#agilenest-design .an-column{min-width:0;background:var(--an-soft);border-radius:8px;padding:10px}
#agilenest-design .an-column-title{display:flex;justify-content:space-between;gap:6px;margin-bottom:12px}
#agilenest-design .an-tile{width:100%;display:block;margin-bottom:9px;padding:12px!important;min-height:100px}
#agilenest-design .an-tile-title{display:block;margin:5px 0 12px;font-weight:500;overflow-wrap:anywhere}
#agilenest-design .an-detail{background:var(--an-panel);border:1px solid var(--an-line);border-radius:9px;padding:18px;min-width:0}
#agilenest-design .an-detail-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
#agilenest-design .an-detail h3{font-size:19px;margin-bottom:12px;overflow-wrap:anywhere}
#agilenest-design .an-note{background:var(--an-soft);padding:12px;border-radius:7px;margin:16px 0}
#agilenest-design .an-note strong{display:block;font-weight:500;margin-bottom:6px}
#agilenest-design dl{margin:16px 0}
#agilenest-design dl div{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px}
#agilenest-design dt{color:var(--an-muted)}
#agilenest-design dd{margin:0;text-align:right}
#agilenest-design .an-next{border-top:1px solid var(--an-line);padding-top:14px;color:var(--an-brand)}
#agilenest-design .an-empty{padding:28px 10px;color:var(--an-muted);text-align:center}
#agilenest-design .an-footer{padding:12px 20px;border-top:1px solid var(--an-line);background:var(--an-panel);font-size:12px;color:var(--an-muted)}
#agilenest-design .an-count{margin-left:auto;color:var(--an-muted);font-size:12px}
#agilenest-design .an-shell.an-no-nav{grid-template-columns:minmax(0,1fr)}
#agilenest-design .an-shell.an-no-nav .an-nav{display:none}
#agilenest-design [hidden]{display:none!important}
@media(max-width:760px){#agilenest-design .an-shell{grid-template-columns:minmax(0,1fr)}#agilenest-design .an-nav{border-right:0;border-bottom:1px solid var(--an-line);display:flex;gap:8px;padding:10px 14px}#agilenest-design .an-nav button{width:auto;margin:0}#agilenest-design .an-nav .an-section,#agilenest-design .an-static{display:none}#agilenest-design .an-main{padding:16px}#agilenest-design .an-content.an-has-detail{grid-template-columns:minmax(0,1fr)}#agilenest-design .an-detail{grid-row:1}#agilenest-design .an-row{flex-wrap:wrap}#agilenest-design input{flex:1;width:130px}#agilenest-design .an-top{padding-left:16px}}
@media(pointer:coarse){#agilenest-design button{min-height:44px}#agilenest-design input{font-size:16px;min-height:44px}}
</style>
<div id="agilenest-design" aria-label="AgileNest 协作界面设计预览">
  <header class="an-top"><span class="an-brand">AgileNest</span><span class="an-small">历史设计预览 · 示例数据 · 不代表当前完整平台</span></header>
  <div class="an-footer">附件上传、项目资料库、成果版本和协作通知请在实际网站中操作。此页仅保留早期任务布局示例，不连接团队数据。</div>
  <div class="an-shell">
    <nav class="an-nav" aria-label="预览页面">
      <button type="button" class="cursor-interaction" data-page="home" aria-pressed="true">工作台</button>
      <button type="button" class="cursor-interaction" data-page="tasks" aria-pressed="false">项目任务</button>
      <div class="an-section">课程项目 · 协作平台</div>
      <span class="an-static">项目概览</span><span class="an-static">项目日历</span><span class="an-static">里程碑</span><span class="an-static">工时与贡献</span>
      <div class="an-section">个人空间</div><span class="an-static">我的日历</span><span class="an-static">AI 草稿 · 未接入模型</span>
    </nav>
    <main class="an-main">
      <div class="an-heading"><div><div class="an-small">敏捷协作实验室 / 协作平台</div><h2 id="an-title">今天，推进一件事</h2><p class="an-small" id="an-subtitle">先处理修改意见，再继续当前任务。</p></div></div>
      <div class="an-focus" aria-label="内容关注点"><button type="button" class="cursor-interaction" data-focus="execution" aria-pressed="true">执行关注</button><button type="button" class="cursor-interaction" data-focus="review" aria-pressed="false">验收关注</button></div>
      <div class="an-toolbar"><label for="an-search" class="an-small">查找任务</label><input id="an-search" placeholder="按任务名称查找" type="search"><button type="button" class="cursor-interaction" data-layout="list" aria-pressed="true">列表</button><button type="button" class="cursor-interaction" data-layout="board" aria-pressed="false">看板</button><span class="an-count" id="an-count" aria-live="polite"></span></div>
      <div class="an-content"><div id="an-items"></div><aside class="an-detail" id="an-detail" aria-label="所选任务详情" hidden></aside></div>
    </main>
  </div>
  <div class="an-footer">关注点仅改变内容排序与筛选 · 不切换账号权限 · 此预览不写入任务</div>
</div>
<script>
(()=>{
const root=document.getElementById('agilenest-design');
const statusNames={unclaimed:'待认领',in_progress:'进行中',submitted:'待验收',rejected:'待修改',accepted:'已完成'};
const tasks=[
{id:'demo-04',title:'补齐窄屏下的任务筛选体验',status:'rejected',owner:'林同学',due:'2026-10-12',priority:'高优先级',estimate:'120 分钟',note:'390px 宽度下，筛选条件遮住了重置入口。请保留已选条件，并验证键盘关闭后的焦点。',next:'负责人完善后重新提交',goal:'在窄屏中完成筛选、查看任务与重置，页面没有横向溢出。'},
{id:'demo-02',title:'统一任务详情与下一步操作',status:'in_progress',owner:'林同学',due:'2026-10-13',priority:'高优先级',estimate:'240 分钟',note:'当前正在整理详情中的成果说明与修改意见层级。',next:'完成后提交成果说明',goal:'看板与列表打开同一任务时，信息和可用操作保持一致。'},
{id:'demo-03',title:'验收队列保留筛选上下文',status:'submitted',owner:'周同学',due:'2026-10-12',priority:'中优先级',estimate:'180 分钟',note:'已完成通过/打回后的队列刷新，保留原筛选。请核对混合职务与空队列场景。',next:'由管理员或指导老师验收',goal:'处理成果后仍能在原队列继续浏览，数量与实际任务一致。'},
{id:'demo-06',title:'统一工时统计口径说明',status:'submitted',owner:'陈同学',due:'2026-10-14',priority:'中优先级',estimate:'90 分钟',note:'已标明顶层任务分母与实际登记分钟，空项目展示暂无数据。',next:'由管理员或指导老师验收',goal:'使用者能解释完成度的分子和分母，子任务不重复计数。'},
{id:'demo-01',title:'梳理项目空状态的下一步入口',status:'unclaimed',owner:'未认领',due:'2026-10-15',priority:'中优先级',estimate:'60 分钟',note:'可执行成员认领后开始；管理员可按权限指派。',next:'有执行职务的成员认领',goal:'没有项目或任务时，页面给出清楚的创建或加入入口。'},
{id:'demo-05',title:'项目导航命名与层级整理',status:'accepted',owner:'林同学',due:'2026-10-09',priority:'中优先级',estimate:'90 分钟',note:'导航名称与项目上下文已确认，原有地址保留。',next:'已完成；有权限时可重新打开',goal:'进入项目后能区分任务、项目日历与个人日历。'}
];
const state={page:'home',focus:'execution',layout:'list',q:'',selected:null};
const design={spacing:14,showNavigation:true};
function applySaved(saved){const s=saved?.privateContent;if(!s||typeof s!=='object')return;for(const k of ['page','focus','layout']){const options={page:['home','tasks'],focus:['execution','review'],layout:['list','board']};if(options[k].includes(s[k]))state[k]=s[k];}if(typeof s.q==='string')state.q=s.q.slice(0,100);state.selected=tasks.some(t=>t.id===s.selected)?s.selected:null;}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'AgileNest',page:state.page,focus:state.focus,layout:state.layout},privateContent:{...state}}).catch(()=>{});}
function pill(t){return '<span class="an-pill" data-status="'+t.status+'">'+statusNames[t.status]+'</span>';}
function render(){
 root.style.setProperty('--an-space',design.spacing+'px');root.querySelector('.an-shell').classList.toggle('an-no-nav',!design.showNavigation);
 root.querySelectorAll('[data-page]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.page===state.page)));
 root.querySelectorAll('[data-focus]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.focus===state.focus)));
 root.querySelectorAll('[data-layout]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.layout===state.layout)));
 root.querySelector('.an-focus').hidden=state.page!=='home';
 root.querySelector('#an-title').textContent=state.page==='tasks'?'项目任务':state.focus==='review'?'让成果获得明确反馈':'今天，推进一件事';
 root.querySelector('#an-subtitle').textContent=state.page==='tasks'?'同一组任务，按状态浏览或集中查看。':state.focus==='review'?'先看完成说明，再判断是否符合验收要求。':'先处理修改意见，再继续当前任务。';
 if(root.querySelector('#an-search').value!==state.q)root.querySelector('#an-search').value=state.q;
 const visible=tasks.filter(t=>(state.page==='tasks'||(state.focus==='review'?t.status==='submitted':t.owner==='林同学'&&t.status!=='accepted'))&&t.title.includes(state.q.trim()));
 root.querySelector('#an-count').textContent=visible.length+' 项任务';
 let markup='';
 if(!visible.length){markup='<div class="an-empty">没有匹配任务。清空搜索后再试。</div>';}
 else if(state.layout==='board'){
 markup='<div class="an-board">'+Object.keys(statusNames).map(s=>{const entries=visible.filter(t=>t.status===s);return '<section class="an-column"><div class="an-column-title">'+pill({status:s})+'<span class="an-small">'+entries.length+'</span></div>'+entries.map(t=>'<button type="button" class="an-tile cursor-interaction" data-task="'+t.id+'"><span class="an-small">'+t.id+'</span><span class="an-tile-title">'+t.title+'</span><span class="an-meta">'+t.owner+' · '+t.due.slice(5)+'</span></button>').join('')+(!entries.length?'<span class="an-small">暂无任务</span>':'')+'</section>';}).join('')+'</div>';
 }else{markup='<div class="an-list">'+visible.map(t=>'<div class="an-row"><div class="an-task-main"><button type="button" class="an-task-title cursor-interaction" data-task="'+t.id+'">'+t.title+'</button><div class="an-meta"><span>'+t.owner+'</span><span>'+t.priority+'</span><span>'+t.due.slice(5)+' 截止</span></div></div>'+pill(t)+'</div>').join('')+'</div>';}
 root.querySelector('#an-items').innerHTML=markup;
 const task=tasks.find(t=>t.id===state.selected);const detail=root.querySelector('#an-detail');detail.hidden=!task;root.querySelector('.an-content').classList.toggle('an-has-detail',!!task);
 if(task){detail.innerHTML='<div class="an-detail-top"><span class="an-small">'+task.id+' · 任务详情</span><button type="button" class="cursor-interaction" data-close aria-label="关闭任务详情">关闭</button></div><h3>'+task.title+'</h3>'+pill(task)+'<div class="an-note"><strong>'+(task.status==='rejected'?'最新修改意见':task.status==='submitted'?'最新完成说明':'当前上下文')+'</strong><span>'+task.note+'</span></div><h4>目标与验收要求</h4><p>'+task.goal+'</p><dl><div><dt>负责人</dt><dd>'+task.owner+'</dd></div><div><dt>截止日期</dt><dd>'+task.due+'</dd></div><div><dt>预计投入</dt><dd>'+task.estimate+'</dd></div></dl><div class="an-next">下一步 · '+task.next+'</div>';}
}
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||!root.contains(button))return;let changed=false;if(button.dataset.page){state.page=button.dataset.page;state.selected=null;changed=true;}if(button.dataset.focus){state.focus=button.dataset.focus;state.selected=null;changed=true;}if(button.dataset.layout){state.layout=button.dataset.layout;changed=true;}if(button.dataset.task){state.selected=button.dataset.task;changed=true;}if(button.hasAttribute('data-close')){const previous=state.selected;state.selected=null;render();root.querySelector('[data-task="'+previous+'"]')?.focus();save();return;}if(changed){render();if(button.dataset.task)root.querySelector('[data-close]')?.focus();save();}});
root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.selected){const previous=state.selected;state.selected=null;render();root.querySelector('[data-task="'+previous+'"]')?.focus();save();}});
root.querySelector('#an-search').addEventListener('input',event=>{state.q=event.target.value;state.selected=null;render();save();});
applySaved(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){applySaved(event.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'spacing',{label:'列表上下间距',min:10,max:20,step:2,unit:'px'});tweak.addToggle(design,'showNavigation',{label:'显示项目导航'});}
})();
</script>
