name: Verify

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  contracts:
    name: PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agilecampus
          POSTGRES_PASSWORD: agilecampus_dev
          POSTGRES_DB: agilecampus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agilecampus -d agilecampus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare isolated test database
        run: Copy-Item -LiteralPath .env.test.example -Destination .env.test
      - run: npm run db:push:test
      - run: npm test

  windows-build:
    name: Windows production build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://agilecampus:agilecampus_dev@localhost:5432/agilecampus_test
      AUTH_SECRET: agilecampus-ci-only-not-for-production
      AGILECAMPUS_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Windows launcher lifetime
        shell: powershell
        run: .\tests\windows\launcher.ps1
